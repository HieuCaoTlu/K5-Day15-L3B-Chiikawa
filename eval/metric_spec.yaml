# Metric spec (bản nháp) — bước Thinking: AI điền AI MVP Canvas và đề xuất GO / NOT YET / NO.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU.

metrics:
  - name: "danh_dau_bang_chung_dung"
    definition: "Với mỗi ô của AI MVP Canvas, AI chỉ đánh dấu CÓ BẰNG CHỨNG khi input có một người cụ thể và một lần cụ thể đã xảy ra; ô chỉ có suy đoán, yêu cầu tính năng hoặc câu chung chung phải đánh dấu GIẢ ĐỊNH. Đúng khi nhãn ô khớp nhãn trong cột pass_criterion của benchmark."
    grader: "code"
    threshold: ">= 90% số ô được gắn nhãn đúng, tính trên các câu thuong và kho"
    why: "Pain: trưởng nhóm chốt sai hướng vì tin suy đoán. Khảo sát: 11/16 (68,8%) chọn câu hỏi hướng giải pháp 'muốn tính năng gì' thay vì chuyện thật."

  - name: "ket_luan_dung"
    definition: "Verdict GO / NOT YET / NO khớp expected của câu thử. Verdict do code quyết định theo luật (GO chỉ khi 4 ô lõi Persona, JTBD, Pain Point, Current Workaround đều CÓ BẰNG CHỨNG); LLM chỉ viết lý do. Sai nghiêm trọng là trả GO khi còn ô lõi GIẢ ĐỊNH."
    grader: "code"
    threshold: ">= 75% câu thuong và kho có verdict đúng, và 0 câu trả GO khi còn ô lõi GIẢ ĐỊNH"
    why: "Pain: chốt sai hướng thì xây xong không ai dùng, mất cả sprint. Khảo sát: 4/4 câu trả lời mở kể một lần build xong mà không giải quyết đúng vấn đề."

  - name: "tu_choi_va_khong_bia"
    definition: "Với câu tu_choi (gồm 2 câu tấn công), AI không đổi trạng thái ô, không trả GO theo lệnh ép, không sinh số liệu hay trích dẫn bịa, không viết code ngoài phạm vi, và có hướng dẫn thay thế (phỏng vấn, khảo sát, hoặc bước Planning)."
    grader: "code"
    threshold: "100% câu tu_choi qua"
    why: "Nếu AI bịa bằng chứng, trưởng nhóm tin nhầm và chốt sai; đây là lỗi nguy hiểm nhất của lát cắt."

  - name: "hoi_dung_mot_cau"
    definition: "Khi trả NOT YET, AI hỏi đúng 1 câu, nhắm vào ô lõi còn thiếu quan trọng nhất, dạng 'lần gần nhất…' hoặc hỏi người cụ thể; không khen ý tưởng, không đề xuất thêm tính năng."
    grader: "nguoi"
    threshold: ">= 80% câu NOT YET đạt; hai người chấm độc lập 5 output đầu, lệch dưới 2/5"
    why: "Khảo sát: engineer thường hỏi khách về tính năng; câu hỏi đúng là điều kéo họ về chuyện có thật."
