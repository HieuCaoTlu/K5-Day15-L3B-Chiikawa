[project]
name = "hackathon-backend"
version = "0.1.0"
description = "FastAPI + LangGraph (Gemini) + Postgres — khung hackathon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.4.0",
    "cryptography>=44",
    "httpx>=0.28.0",
    "pywebpush>=2.0.3",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501", "B008"]  # B008: Depends() trong tham số là cách chuẩn của FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
