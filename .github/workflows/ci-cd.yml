# CI/CD một file: PR → test; push main → test → deploy lên VPS qua SSH.
#
#   1. Backend và frontend kiểm tra SONG SONG trên máy GitHub (ubuntu-latest), có cache uv/npm.
#   2. Frontend chỉ typecheck ở CI (không build 2 lần) — build thật nằm trong Docker, có cache mount.
#   3. Deploy `needs` test: đẩy code lên VPS bằng SSH (git archive → deploy/deploy.sh), docker compose build trên VPS.
#   4. PR đẩy commit mới → huỷ lượt CI cũ của PR đó (cancel-in-progress).
#
# Deploy cần 3 secrets: VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS (xem deploy/README.md).
# Chưa có secrets → job deploy bỏ qua và ghi cảnh báo, CI vẫn xanh.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cài dependency
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test (offline, SQLite trong RAM, không key)
        run: uv run pytest
      - name: Eval agent
        run: uv run python eval/run_eval.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài dependency
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Đẩy code lên VPS qua SSH và deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          for v in SSH_KEY KNOWN_HOSTS HOST; do
            if [ -z "${!v}" ]; then
              echo "::warning::Chưa cấu hình secrets VPS_SSH_KEY / VPS_KNOWN_HOSTS / VPS_HOST — bỏ qua deploy (xem deploy/README.md)"
              exit 0
            fi
          done
          dir="$RUNNER_TEMP/ssh"; mkdir -p "$dir"; trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$dir/key"; chmod 600 "$dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          git -c core.autocrlf=false archive --format=tar.gz HEAD \
            | ssh -i "$dir/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$dir/known_hosts" \
                  -o StrictHostKeyChecking=yes deploy@"$HOST" "$(git rev-parse HEAD)"
